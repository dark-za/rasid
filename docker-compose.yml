services:
  backend:
    build: ./backend
    container_name: rasid-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
      APP_DB_USER: ${APP_DB_USER:-rasid_app}
      ATTENDANCE_DB_USER: ${ATTENDANCE_DB_USER:-rasid_reader}
      APP_DB_NAME: ${APP_DB_NAME:-rasid_db}
      ATTENDANCE_DB_NAME: ${ATTENDANCE_DB_NAME:-smartpss_local}
      # كلمتا السر مشفّرتان (Fernet) + المفتاح — شغّل docs/mysql-setup.sql أولاً
      DB_PASS_ENC: ${DB_PASS_ENC:-}
      ATTENDANCE_PASS_ENC: ${ATTENDANCE_PASS_ENC:-}
      RASID_SECRETS_KEY: ${RASID_SECRETS_KEY:-}
      # بدائل صريحة للتطوير المحلي فقط:
      DB_PASS: ${DB_PASS:-}
      ATTENDANCE_PASS: ${ATTENDANCE_PASS:-}
      RASID_API_KEY: ${RASID_API_KEY:?Set RASID_API_KEY in the environment or .env file}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3005,http://127.0.0.1:3005}
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Riyadh}
      ATTENDANCE_EPOCH_IS_LOCAL: ${ATTENDANCE_EPOCH_IS_LOCAL:-true}
      DEBOUNCE_MINUTES: ${DEBOUNCE_MINUTES:-5}
      DEFAULT_SHIFT_START: ${DEFAULT_SHIFT_START:-08:00}
      DEFAULT_GRACE_MINUTES: ${DEFAULT_GRACE_MINUTES:-15}
    extra_hosts:
      - "host.docker.internal:host-gateway"
