limit_req_zone $binary_remote_addr zone=rasid_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rasid_login:10m rate=5r/m;
limit_req_status 429;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    # واجهة React (SPA) — أي مسار غير معروف يعود لـ index.html
    location / {
        try_files $uri /index.html;
    }

    location = /api/auth/login {
        limit_req zone=rasid_login burst=3 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # تمرير طلبات API إلى خدمة الباكند داخل شبكة compose
    location /api/ {
        limit_req zone=rasid_api burst=30 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
